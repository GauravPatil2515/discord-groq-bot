version: "3.8"

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_groq_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Resource constraints for clean server hosting
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
